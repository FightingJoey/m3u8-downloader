services:
  m3u8-ph:
    build: .
    image: m3u8-downloader-ph:latest
    container_name: m3u8-downloader-ph
    ports:
      - "${PH_PORT:-8765}:8765"
    environment:
      PH_HOST: "0.0.0.0"
      PH_PORT: "8765"
      # Only pass UPPERCASE proxy vars. Do NOT inject lowercase http_proxy /
      # https_proxy / all_proxy / no_proxy with ${var:-}: when the host shell
      # has them unset, Compose writes empty strings, and CPython's
      # getproxies_environment() then DELETES matching uppercase entries
      # (empty lowercase wins). Result: getproxies()=={} and HTTPS goes direct.
      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      ALL_PROXY: "${ALL_PROXY:-}"
      NO_PROXY: "${NO_PROXY:-}"
    volumes:
      # Persist rewritten playlists / meta across restarts (optional)
      - ph-cache:/app/cache
    restart: unless-stopped

volumes:
  ph-cache:
