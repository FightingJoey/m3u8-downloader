services:
  m3u8-ph:
    build: .
    image: m3u8-downloader-ph:latest
    container_name: m3u8-downloader-ph
    ports:
      - "${PH_PORT:-8765}:8765"
    environment:
      PH_HOST: "0.0.0.0"
      PH_PORT: "8765"
      # Pass host proxy into the container (Compose substitutes from the shell env).
      # Unset vars become empty strings and are ignored by urllib.
      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      ALL_PROXY: "${ALL_PROXY:-}"
      NO_PROXY: "${NO_PROXY:-}"
      http_proxy: "${http_proxy:-}"
      https_proxy: "${https_proxy:-}"
      all_proxy: "${all_proxy:-}"
      no_proxy: "${no_proxy:-}"
    volumes:
      # Persist rewritten playlists / meta across restarts (optional)
      - ph-cache:/app/cache
    restart: unless-stopped

volumes:
  ph-cache:
