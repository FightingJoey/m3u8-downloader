services:
  m3u8-ph:
    build: .
    image: m3u8-downloader-ph:latest
    container_name: m3u8-downloader-ph
    ports:
      - "${PH_PORT:-8765}:8765"
    environment:
      PH_HOST: "0.0.0.0"
      PH_PORT: "8765"
    volumes:
      # Persist rewritten playlists / meta across restarts (optional)
      - ph-cache:/app/cache
    restart: unless-stopped

volumes:
  ph-cache:
